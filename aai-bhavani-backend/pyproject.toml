[project]
name = "aai-bhavani-backend"
version = "0.1.0"
description = "Aai Bhavani Consultant - CMS Backend (Django + DRF)"
requires-python = ">=3.11"

dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "django-filter>=24.1",
    "django-environ>=0.11",
    "cloudinary>=1.40",
    "django-cloudinary-storage>=0.3",
    "Pillow>=10.4",
    "gunicorn>=22.0",
    "whitenoise>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-django>=4.8",
    "black>=24.4",
    "ruff>=0.4",
]

# Production mein PostgreSQL chahiye tab:
# uv add psycopg2-binary

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
